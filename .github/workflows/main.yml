name: Génération API FLA

on:
  schedule:
    - cron: '0 8 * * *' # Tous les jours à 8h
  workflow_dispatch: # Bouton manuel

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Autorise le bot à écrire dans le dépôt
      
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Installer les bibliothèques
        run: pip install -r requirements.txt
        
      - name: Lancer le script (Générer le JSON)
        run: python bot_fla.py
        
      - name: Sauvegarder et publier le JSON
        run: |
          git config --global user.name "Bot-FLA"
          git config --global user.email "bot@actions.github.com"
          git add classement.json
          git commit -m "Mise à jour automatique du classement" || echo "Aucun changement à sauvegarder"
          git push
