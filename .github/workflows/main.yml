name: Génération API FLA

on:
  schedule:
    - cron: '0 8 * * *' # Tous les jours à 8h
  workflow_dispatch: # Bouton manuel
    inputs:
      test_push:
        description: "Envoyer une notification de test à tous les appareils abonnés"
        type: boolean
        default: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Autorise le bot à écrire dans le dépôt

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les bibliothèques
        run: pip install -r requirements.txt

      - name: Lancer le scraper (nouveau site FLA)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scrape_fla.py

      - name: Générer les notifications (relances, absences auto, vote dispo)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_TEST: ${{ inputs.test_push }}
        run: python notifications_cron.py

      - name: Sauvegarder et publier les JSON
        run: |
          git config --global user.name "Bot-FLA"
          git config --global user.email "bot@actions.github.com"
          git add classement.json matches.json calendrier.ics
          git commit -m "Mise à jour automatique (Classement + Calendrier)" || echo "Aucun changement à sauvegarder"
          git push

name: Actualisation FLA

on:
  schedule:
    # 7h et 8h UTC (couvre 9h Paris été/hiver) | 21h et 22h UTC (couvre 23h Paris été/hiver)
    - cron: '0 7,8,21,22 * * *'
  workflow_dispatch: # Permet de lancer le workflow manuellement depuis GitHub si besoin

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: pip install requests beautifulsoup4

      - name: Exécution du scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scrape_fla.py

      - name: Commit et Push des fichiers JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add matches.json classement.json calendrier.ics
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour automatique des données FLA" && git push)
