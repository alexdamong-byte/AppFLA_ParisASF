<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paris ASF</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1119">
<script>try{if(localStorage.getItem("parisasf_theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Paris ASF">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
.login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center;}
.login h1{font-size:22px;margin-bottom:6px;}
.login p{color:var(--muted);font-size:13px;margin-bottom:22px;}
.login input{width:100%;max-width:280px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
 background:var(--card);color:var(--text);font-size:14px;margin-bottom:10px;}
.login button{width:100%;max-width:280px;padding:12px;border-radius:10px;border:none;background:var(--green);
 color:#fff;font-weight:700;font-size:14px;}
.login .msg{margin-top:14px;font-size:13px;color:var(--green);min-height:18px;}
.login .err{color:var(--red);}
:root{
 --bg:#ffffff; --card:#ffffff; --header:#0a1119; --line:#e6e9ec;
 --green:#02876c; --red:#ba0000; --grey:#ababab; --gold:#dda520;
 --text:#12181f; --muted:#6b7680; --chipbg:#f0f2f4;
}
[data-theme="dark"]{
 --bg:#0d1b2a; --card:#122a3e; --header:#070f18; --line:#1f3348;
 --text:#f2f5f7; --muted:#9fb0bf; --chipbg:#1a3049;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);}
#app{max-width:460px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);
 padding-top:calc(56px + env(safe-area-inset-top,0));padding-bottom:calc(64px + env(safe-area-inset-bottom,0));}
.topbar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;z-index:15;
 background:var(--header);color:#fff;padding:calc(12px + env(safe-area-inset-top,0)) 16px 12px;
 display:flex;align-items:center;justify-content:space-between;}
.topbar b{font-size:16px;letter-spacing:.5px;}
.topbar .right{display:flex;align-items:center;gap:14px;}
.iconbtn{position:relative;font-size:19px;cursor:pointer;background:none;border:none;color:#fff;}
.badge{position:absolute;top:-5px;right:-7px;background:var(--red);color:#fff;font-size:10px;
 width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;font-weight:700;
 display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
main{padding:14px 12px 20px;}
h2.title{text-align:center;font-weight:800;font-size:15px;letter-spacing:.5px;margin-bottom:10px;}
.sheet-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.mrow{display:flex;gap:12px;padding:12px 12px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer;}
.mrow:last-child{border-bottom:none;}
.dblock{width:54px;flex-shrink:0;border-radius:10px;padding:8px 0;text-align:center;color:#fff;}
.dblock b{display:block;font-size:19px;line-height:1;}
.dblock span{font-size:10px;text-transform:uppercase;}
.d-wait{background:var(--header);}
.d-no{background:var(--red);}
.d-yes{background:var(--green);}
.d-past{background:var(--grey);}
.minfo{flex:1;min-width:0;}
.comp{font-size:11px;color:var(--gold);display:flex;align-items:center;gap:4px;margin-bottom:2px;}
.trow{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;}
.trow.win{font-weight:800;}
.venue{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;z-index:15;
 background:var(--header);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0));gap:6px;}
nav button{flex:1;background:none;border:none;color:#b9c3cc;font-size:11px;padding:8px 0;border-radius:20px;
 display:flex;flex-direction:column;align-items:center;gap:3px;}
nav button.active{background:var(--green);color:#fff;}
.backbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.backbar .bk{font-size:20px;cursor:pointer;color:var(--text);background:none;border:none;}
.mhead{text-align:center;padding:2px 0 14px;}
.mhead .dt{font-weight:800;font-size:16px;}
.mhead .tm{font-weight:800;font-size:16px;}
.mhead a{color:var(--green);font-size:13px;display:block;margin-top:4px;text-decoration:underline;cursor:pointer;}
.mhead .comp2{font-size:12px;color:var(--gold);margin-top:4px;display:flex;justify-content:center;gap:4px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
.teamrow{display:flex;justify-content:space-between;font-size:15px;font-weight:500;padding:5px 0;}
.teamrow.win{font-weight:800;}
h3.sect{text-align:center;font-size:12px;letter-spacing:1px;color:var(--muted);margin:14px 0 8px;text-transform:uppercase;}
.oui-non{display:flex;gap:10px;}
.oui-non button{flex:1;padding:11px;border-radius:10px;border:none;font-weight:700;background:var(--chipbg);color:var(--text);}
.oui-non button.yesOn{background:var(--green);color:#fff;}
.oui-non button.noOn{background:var(--red);color:#fff;}
.pgroup{margin-top:14px;}
.pgroup .cnt{display:flex;gap:8px;align-items:baseline;font-weight:800;margin-bottom:4px;}
.cnt.g{color:var(--green);} .cnt.r{color:var(--red);} .cnt.gy{color:var(--muted);}
.pgroup .names{font-size:13px;color:var(--text);line-height:1.6;padding-left:2px;}
.votebtn{display:block;width:100%;background:var(--green);color:#fff;border:none;padding:13px;border-radius:10px;font-weight:700;font-size:14px;}
.voteopt{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);}
.voteopt button{background:var(--chipbg);border:none;color:var(--green);font-weight:700;padding:6px 12px;border-radius:8px;}
.winner{display:flex;align-items:center;gap:10px;}
.winner .av{width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.winner b{font-size:14px;}
.winner i{color:var(--green);font-size:12px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{font-weight:800;text-align:center;padding:7px 4px;border-bottom:2px solid var(--line);}
td{text-align:center;padding:7px 4px;border-bottom:1px solid var(--line);}
th:nth-child(2),td:nth-child(2){text-align:left;}
tr:last-child td{border-bottom:none;}
.tot{background:var(--chipbg);font-weight:800;}
.hi{background:var(--chipbg);}
.proto{background:#3a2e10;color:#e8b93b;font-size:11px;padding:7px 10px;border-radius:8px;margin-bottom:10px;text-align:center;}
.manager{font-size:12px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
.overlay{position:fixed;inset:0;max-width:460px;margin:0 auto;z-index:30;display:none;background:var(--card);
 padding-top:env(safe-area-inset-top,0);}
.overlay.open{display:block;}
.ov-head{display:flex;justify-content:space-between;align-items:center;padding:16px;}
.ov-head b{font-size:14px;letter-spacing:1px;}
.ov-head .x{font-size:20px;cursor:pointer;background:none;border:none;color:inherit;}
.nitem{display:flex;gap:10px;padding:12px 16px;border-left:4px solid transparent;border-bottom:1px solid var(--line);}
.nitem.unread{border-left-color:var(--red);}
.nitem .t{font-size:11px;color:var(--muted);margin-top:3px;}
.nitem .del{margin-left:auto;color:var(--red);cursor:pointer;font-size:15px;}
.profov{background:var(--green);color:#fff;height:100%;text-align:center;}
.profov .ov-head b,.profov .ov-head .x{color:#fff;}
.profov .av2{width:70px;height:70px;border-radius:50%;background:#fff;color:var(--green);font-size:22px;font-weight:800;
 display:flex;align-items:center;justify-content:center;margin:20px auto 12px;}
.profov h4{font-size:16px;}
.profov a{color:#fff;font-size:13px;display:block;margin-top:6px;text-decoration:underline;}
.deco{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom,0));left:0;right:0;text-align:center;}
.roleswitch{display:flex;gap:8px;justify-content:center;margin-top:22px;padding:0 20px;}
.roleswitch button{flex:1;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.5);background:none;color:#fff;font-size:12px;font-weight:600;}
.roleswitch button.on{background:#fff;color:var(--green);}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);color:var(--text);border-radius:16px 16px 0 0;
 max-width:460px;margin:0 auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0));display:none;z-index:40;}
.sheet.open{display:block;}
.ov2{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:39;}
.ov2.open{display:block;}
.sheet .opt{padding:13px 4px;font-size:15px;border-bottom:1px solid var(--line);}
.sheet .opt:last-child{border:none;color:var(--red);text-align:center;}
.small{font-size:12px;color:var(--muted);}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
.tag.g{background:rgba(2,135,108,.15);color:var(--green);}
.tag.r{background:rgba(186,0,0,.12);color:var(--red);}
.tag.grey{background:var(--chipbg);color:var(--muted);}
.seg{display:flex;gap:6px;}
.segbtn{min-width:54px;padding:9px 10px;border-radius:8px;border:none;font-weight:700;font-size:12px;background:var(--chipbg);color:var(--muted);cursor:pointer;}
.segbtn.on-yes{background:var(--green);color:#fff;}
.segbtn.on-no{background:var(--red);color:#fff;}
.chk{cursor:pointer;}
.chk input[type=checkbox]{width:22px;height:22px;accent-color:var(--green);flex-shrink:0;}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--card);color:var(--text);border-radius:16px;padding:20px;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.35);}
.modal h4{font-size:17px;margin-bottom:8px;}
.modal p{font-size:13.5px;color:var(--muted);line-height:1.45;}
.mbtns{display:flex;gap:10px;}
.mbtn{flex:1;padding:12px;border-radius:10px;border:none;font-weight:700;font-size:14px;background:var(--chipbg);color:var(--text);cursor:pointer;}
.mbtn.danger{background:var(--red);color:#fff;}
.mbtn:disabled{opacity:.4;cursor:not-allowed;}
.delbtn{background:none;border:none;font-size:18px;padding:6px 8px;cursor:pointer;color:var(--red);}
</style>
</head>
<body>
<div class="login" id="loginScreen">
 <h1>PARIS ASF</h1>
 <p>Connecte-toi avec l'email de ton équipe pour recevoir un lien de connexion.</p>
 <input type="email" id="loginEmail" placeholder="ton.email@exemple.com">
 <button id="loginBtn">Recevoir le lien de connexion</button>
 <div class="msg" id="loginMsg"></div>
 <div id="codeBox" style="display:none;margin-top:10px;width:100%;max-width:280px">
  <input type="text" id="loginCode" inputmode="numeric" autocomplete="one-time-code" placeholder="Code reçu par email">
  <button id="codeBtn">Valider le code</button>
 </div>
</div>
<div id="app" style="display:none">
 <div class="topbar">
  <b>PARIS ASF</b>
  <div class="right">
   <button class="iconbtn" id="bellBtn">🔔<span class="badge" id="bellBadge" style="display:none"></span></button>
   <div class="avatar" id="avatarBtn"></div>
  </div>
 </div>
 <main id="main"></main>
 <nav id="nav">
  <button data-tab="cal"><span>📅</span>Calendrier</button>
  <button data-tab="rank"><span>🏆</span>Classement</button>
  <button data-tab="club"><span>🛡️</span>Club</button>
 </nav>
</div>
<div class="overlay" id="notifOv"></div>
<div class="overlay" id="profOv"></div>
<div class="ov2" id="ov2"></div>
<div class="sheet" id="sheet"></div>

<script>
const SUPABASE_URL = "https://wwesvvclxvgktgchmwmf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3ZXN2dmNseHZna3RnY2htd21mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2ODIzMDcsImV4cCI6MjEwNjI1ODMwN30.4_SA-HnMKP73noJ6QOeUJJ8dViCOp3WzLhN-w7H8K2Q";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let ME="", MY_ID="", MY_EMAIL="", ROLE="joueur", currentTab="cal", currentMatch=null, theme="light";
const initials=n=>n.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cleanVenue=v=>(v||"").replace(/\s*\(ouvre l'itinéraire[^)]*\)\s*/gi,"").trim()||"Lieu à confirmer";
let effectif=[]; // [{id, nom}]

async function loadJoueurEtDemarre(session){
 const email = session.user.email;
 const {data, error} = await sb.from("joueurs").select("id,nom,role").eq("email", email).eq("actif", true).maybeSingle();
 if(error || !data){
  document.getElementById("loginMsg").innerHTML = "Cet email ne fait pas partie de l'effectif enregistré.";
  document.getElementById("loginMsg").classList.add("err");
  await sb.auth.signOut();
  return;
 }
 ME = data.nom; MY_ID = data.id; ROLE = data.role; MY_EMAIL = email;
 const {data: tousJoueurs} = await sb.from("joueurs").select("id,nom,role").eq("actif", true);
 effectif = tousJoueurs||[];
 if(!effectif.some(j=>j.id===MY_ID)) effectif.push({id:MY_ID, nom:ME, role:ROLE});
 await loadDonneesFLA();
 await loadNotifications();
 document.getElementById("loginScreen").style.display="none";
 document.getElementById("app").style.display="block";
 render();
}
document.getElementById("loginBtn").onclick = async ()=>{
 const email = document.getElementById("loginEmail").value.trim();
 const msg = document.getElementById("loginMsg");
 msg.classList.remove("err");
 if(!email){ msg.textContent="Merci de saisir un email."; msg.classList.add("err"); return; }
 msg.textContent="Envoi en cours...";
 const {error} = await sb.auth.signInWithOtp({email, options:{emailRedirectTo: window.location.href}});
 msg.textContent = error ? "Erreur : "+error.message : "Email envoyé ! Clique sur le lien, ou saisis ci-dessous le code reçu (utile dans l'app installée sur iPhone).";
 if(!error) document.getElementById("codeBox").style.display="block";
 if(error) msg.classList.add("err");
};
document.getElementById("codeBtn").onclick = async ()=>{
 const email = document.getElementById("loginEmail").value.trim();
 const token = document.getElementById("loginCode").value.trim();
 const msg = document.getElementById("loginMsg"); msg.classList.remove("err");
 const {error} = await sb.auth.verifyOtp({email, token, type:"email"});
 if(error){ msg.textContent = "Code invalide ou expiré."; msg.classList.add("err"); }
};
sb.auth.onAuthStateChange((event, session)=>{ if(session) loadJoueurEtDemarre(session); });
sb.auth.getSession().then(({data})=>{ if(data.session) loadJoueurEtDemarre(data.session); });

let matches=[], ranking=[];
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const fmtTime=d=>d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
const fmtDay=d=>d.getDate().toString().padStart(2,"0");
const fmtMonAbbr=d=>MOIS[d.getMonth()].slice(0,3)+".";
const fmtDateFull=d=>`${d.getDate()} ${MOIS[d.getMonth()].toUpperCase()} ${d.getFullYear()}`;

const sourceId = m => `${m.competition}|${m.domicile}|${m.exterieur}|${m.date}`;

async function loadDonneesFLA(){
 try{
  const [mRes, clRes] = await Promise.all([fetch("matches.json"), fetch("classement.json")]);
  const rawMatches = await mRes.json(), cl = await clRes.json();
  const {data: dbMatches} = await sb.from("matchs").select("id,source_id,feuille_validee,stats_remplies");
  const dbBySource = {}; (dbMatches||[]).forEach(r=>dbBySource[r.source_id]=r);
  matches = rawMatches.filter(m=>m.date).map((m,idx)=>{
   const row = dbBySource[sourceId(m)];
   return {id:`${idx}-${m.date}`, dbId: row?row.id:null, feuilleValidee: row?!!row.feuille_validee:false,
    statsRemplies: row?!!row.stats_remplies:false,
    comp:m.competition, dt:new Date(m.date), home:m.domicile, away:m.exterieur,
    venue:cleanVenue(m.venue), status:m.statut, score:m.score, presence:{}};
  }).sort((a,b)=>a.dt-b.dt);
  ranking = cl.map(r=>({p:r.equipe, pt:r.points, j:r.joues, g:r.gagnes, n:r.nuls, l:r.perdus, me:r.equipe==="PARIS ASF"}))
   .sort((a,b)=>b.pt-a.pt);
 }catch(e){ console.error("Chargement FLA impossible", e); }
}
let notifs=[];
function relTime(iso){
 const diff = Date.now()-new Date(iso).getTime();
 const h = Math.floor(diff/3600000);
 if(h<1) return "À l'instant";
 if(h<24) return `Il y a ${h}h`;
 const j = Math.floor(h/24);
 return j===1?"Hier":`Il y a ${j} jours`;
}
async function loadNotifications(){
 const {data} = await sb.from("notifications").select("id,message,lu,created_at").eq("joueur_id", MY_ID).order("created_at",{ascending:false}).limit(30);
 notifs = data||[];
}
async function supprimerNotif(id){
 await sb.from("notifications").delete().eq("id", id);
 notifs = notifs.filter(n=>n.id!==id);
 openNotif();
}

function groupCounts(m){
 const g={yes:[],no:[],wait:[]};
 effectif.forEach(j=>{const p=(m.presenceReal||{})[j.id]; g[p==="oui"?"yes":p==="non"?"no":"wait"].push(j.nom);});
 return g;
}
async function loadPresences(m){
 if(!m.dbId) return;
 const {data} = await sb.from("presences").select("joueur_id,statut").eq("match_id", m.dbId);
 m.presenceReal = {}; (data||[]).forEach(r=>m.presenceReal[r.joueur_id]=r.statut);
}
async function setPresence(m, statut){
 if(!m.dbId) return;
 const {error} = await sb.from("presences").upsert(
  {match_id:m.dbId, joueur_id:MY_ID, statut, updated_at:new Date().toISOString()},
  {onConflict:"match_id,joueur_id"}
 );
 if(error){ alert("Enregistrement impossible : "+error.message); return; }
 await loadPresences(m); render();
}

async function refreshEffectif(){
 const {data} = await sb.from("joueurs").select("id,nom,role").eq("actif", true);
 effectif = data||[];
 if(!effectif.some(j=>j.id===MY_ID)) effectif.push({id:MY_ID, nom:ME, role:ROLE});
}
async function ajouterJoueur(nom, email, role){
 if(!nom||!email){ alert("Nom et email requis."); return; }
 const {error} = await sb.from("joueurs").insert({nom, email:email.trim().toLowerCase(), role});
 if(error){ alert("Erreur : "+error.message); return; }
 await refreshEffectif(); await refreshClubStats(); render();
}
function retirerJoueur(id){
 if(id===MY_ID){ alert("Tu ne peux pas te retirer toi-même."); return; }
 const j = effectif.find(e=>e.id===id); if(!j) return;
 const qui = j.role==="manager" ? "ce manager" : "ce joueur";
 const bg = document.createElement("div"); bg.className = "modalbg";
 bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
  <h4>Supprimer ${esc(j.nom)} ?</h4>
  <p>Êtes-vous sûr de vouloir supprimer ${qui} du club ? Il n'aura plus accès à l'application. Son historique (présences, stats, votes) est conservé.</p>
  <label class="chk" style="display:flex;gap:10px;align-items:flex-start;margin:14px 0"><input type="checkbox" id="mdlChk" style="accent-color:var(--red)"><span>Oui, je confirme la suppression de <b>${esc(j.nom)}</b></span></label>
  <div class="mbtns"><button class="mbtn" id="mdlCancel">Annuler</button><button class="mbtn danger" id="mdlOk" disabled>Supprimer</button></div>
 </div>`;
 document.body.appendChild(bg);
 const close = ()=>bg.remove();
 const chk = bg.querySelector("#mdlChk"), ok = bg.querySelector("#mdlOk");
 bg.querySelector("#mdlCancel").onclick = close;
 bg.onclick = e=>{ if(e.target===bg) close(); };
 chk.onchange = ()=>{ ok.disabled = !chk.checked; };
 ok.onclick = async ()=>{
  if(!chk.checked) return;
  ok.disabled = true;
  const r = await sb.from("joueurs").update({actif:false}).eq("id", id).select("id");
  close();
  if(r.error || !r.data || !r.data.length){ alert("Suppression impossible : "+(r.error?r.error.message:"droits insuffisants (SQL add_gestion_effectif.sql exécuté ?)")); return; }
  await refreshEffectif(); await refreshClubStats(); render();
 };
}

async function loadPastMatchData(m){
 if(!m.dbId) return;
 const {data:pres} = await sb.from("presences").select("joueur_id,statut,a_reellement_joue").eq("match_id", m.dbId);
 m.presenceAll = pres||[];
 // Brouillon d'édition manager : si pas encore validé, pré-coché selon la présence déclarée (OUI)
 if(!m.validationDraft){
  m.validationDraft = {};
  effectif.forEach(j=>{
   const row = (pres||[]).find(r=>r.joueur_id===j.id);
   m.validationDraft[j.id] = m.feuilleValidee ? !!(row&&row.a_reellement_joue) : (row ? row.statut==="oui" : false);
  });
 }
 m.playersOk = m.feuilleValidee ? effectif.filter(j=>(pres||[]).some(r=>r.joueur_id===j.id && r.a_reellement_joue)) : [];

 const {data:statsRows} = await sb.from("stats_joueurs").select("joueur_id,buts,passes_decisives,gardien").eq("match_id", m.dbId);
 if(!m.statsDraft){
  m.statsDraft = {};
  m.playersOk.forEach(j=>{
   const row = (statsRows||[]).find(r=>r.joueur_id===j.id);
   m.statsDraft[j.id] = {buts:row?row.buts:0, pd:row?row.passes_decisives:0, gardien:row?row.gardien:false};
  });
 }
 m.scoreOfficiel = m.home==="PARIS ASF" ? (m.score?m.score[0]:null) : (m.score?m.score[1]:null);

 const voteActif = m.feuilleValidee && m.statsRemplies;
 const {data:votes} = await sb.from("votes_homme_du_match").select("votant_id,candidat_id").eq("match_id", m.dbId);
 m.myVote = (votes||[]).find(v=>v.votant_id===MY_ID)?.candidat_id || null;
 m.voteCounts = {}; (votes||[]).forEach(v=>{m.voteCounts[v.candidat_id]=(m.voteCounts[v.candidat_id]||0)+1;});
 const votantIds = new Set((votes||[]).map(v=>v.votant_id));
 const tousOntVote = voteActif && m.playersOk.length>0 && m.playersOk.every(j=>votantIds.has(j.id));
 m.voteActif = voteActif;
 m.voteVisible = tousOntVote || (voteActif && (Date.now()-m.dt.getTime()) >= 48*3600*1000);
}

 await loadPastMatchData(m); render();
}

let clubRows=null, clubErr=null;
async function refreshClubStats(){
 const ids = matches.filter(m=>m.dbId).map(m=>m.dbId);
 const [r1,r2,r3,r4] = await Promise.all([
  ids.length ? sb.from("presences").select("match_id,joueur_id").in("match_id", ids).eq("a_reellement_joue", true) : {data:[]},
  ids.length ? sb.from("stats_joueurs").select("match_id,joueur_id,buts,passes_decisives,gardien").in("match_id", ids) : {data:[]},
  ids.length ? sb.from("votes_homme_du_match").select("match_id,votant_id,candidat_id").in("match_id", ids) : {data:[]},
  sb.from("joueurs").select("id,nom,actif"),
 ]);
 const err = [r1,r2,r3,r4].find(r=>r.error);
 if(err){ clubErr = err.error.message; return; }
 clubErr = null;
 const byId = {}; matches.forEach(m=>{ if(m.dbId) byId[m.dbId]=m; });
 const tot = {};
 const row = id => tot[id] || (tot[id] = {j:0,b:0,pd:0,gb:0,hm:0});
 const parMatch = {};
 // J : matchs réellement joués (feuille validée par un manager)
 (r1.data||[]).forEach(p=>{
  const m = byId[p.match_id]; if(!m || !m.feuilleValidee) return;
  row(p.joueur_id).j++; (parMatch[p.match_id] = parMatch[p.match_id] || []).push(p.joueur_id);
 });
 // B / PD / GB : stats validées par un manager
 (r2.data||[]).forEach(st=>{
  const m = byId[st.match_id]; if(!m || !m.statsRemplies) return;
  const r = row(st.joueur_id); r.b += st.buts||0; r.pd += st.passes_decisives||0; if(st.gardien) r.gb++;
 });
 // HM : uniquement si le vote est clos (tous les joueurs ont voté, ou 48h après le match)
 const votesParMatch = {};
 (r3.data||[]).forEach(v=>{ (votesParMatch[v.match_id] = votesParMatch[v.match_id] || []).push(v); });
 Object.keys(parMatch).forEach(mid=>{
  const m = byId[mid]; if(!m.statsRemplies) return;
  const votes = votesParMatch[mid] || []; if(!votes.length) return;
  const votants = new Set(votes.map(v=>v.votant_id));
  const clos = parMatch[mid].every(id=>votants.has(id)) || (Date.now()-m.dt.getTime()) >= 48*3600*1000;
  if(!clos) return;
  const cnt = {}; votes.forEach(v=>{ cnt[v.candidat_id] = (cnt[v.candidat_id]||0)+1; });
  const max = Math.max(...Object.values(cnt));
  Object.keys(cnt).filter(id=>cnt[id]===max).forEach(id=>row(id).hm++);
 });
 clubRows = (r4.data||[])
  .filter(j=>j.actif || (tot[j.id] && tot[j.id].j>0))
  .map(j=>Object.assign({id:j.id, n:j.nom}, tot[j.id] || {j:0,b:0,pd:0,gb:0,hm:0}))
  .sort((a,b)=>a.n.localeCompare(b.n,"fr"));
}

 <div class="mhead"><div class="dt">${fmtDateFull(m.dt)}</div><div class="tm">${fmtTime(m.dt)}</div>

 } else if(!m.dbId){

 } else {

  if(ROLE==="manager"){

 bind();

  const nm = document.getElementById("nextMatch");

function bind(){
 document.querySelectorAll("[data-open]").forEach(el=>el.onclick=async ()=>{
  currentMatch=matches.find(m=>m.id==el.dataset.open); render();
  if(currentMatch && currentMatch.dbId){
   if(currentMatch.status==="upcoming" && !currentMatch.presenceReal){ await loadPresences(currentMatch); render(); }
   if(currentMatch.status==="past" && !currentMatch.playersOk){ await loadPastMatchData(currentMatch); render(); }
  }
 });
 const bk=document.querySelector("[data-back]"); if(bk) bk.onclick=()=>{currentMatch=null; render();};
 document.querySelectorAll("[data-pres]").forEach(b=>b.onclick=()=>setPresence(currentMatch, b.dataset.pres));

function openSheet(opts){
 const s=document.getElementById("sheet"), o=document.getElementById("ov2");
 const items=opts.map(x=>typeof x==="string"?{label:x}:x);
 s.innerHTML=items.map(x=>`<div class="opt">${x.label}</div>`).join("")+`<div class="opt">Annuler</div>`;
 s.classList.add("open"); o.classList.add("open");
 const close=()=>{s.classList.remove("open"); o.classList.remove("open");};
 o.onclick=close;
 s.querySelectorAll(".opt").forEach((el,i)=>el.onclick=()=>{ close(); if(items[i]&&items[i].run) items[i].run(); });
}
function openVenueMenu(venue){
 const q=encodeURIComponent(venue);
 openSheet([
  {label:"Ouvrir dans Google Maps", run:()=>window.open(`https://www.google.com/maps/search/?api=1&query=${q}`,"_blank")},
  {label:"Ouvrir dans Waze", run:()=>window.open(`https://waze.com/ul?q=${q}&navigate=yes`,"_blank")},
  {label:"Ouvrir dans Apple Plans", run:()=>window.open(`https://maps.apple.com/?q=${q}`,"_blank")},
 ]);
}
function openAgendaMenu(){
 const https=new URL("calendrier.ics", location.href).href;
 const webcal=https.replace(/^https?:/,"webcal:");
 openSheet([
  {label:"S'abonner (iPhone, Mac, Android)", run:()=>{ window.location.href=webcal; }},
  {label:"Copier le lien (Google Agenda, Outlook…)", run:()=>{
    (navigator.clipboard?navigator.clipboard.writeText(https):Promise.reject()).then(()=>alert("Lien copié !")).catch(()=>prompt("Copie ce lien :", https));
  }},
 ]);
}
const VAPID_PUBLIC = "BDtnsQ82oKQ9B3oUuFY0FOWWs8h5M2zGxOSD38ol4ykrbdHE9XqgClg-01qNo7O9jH4gJ3pv0xCEUvUG_lmHrok";
const u8 = b64 => { const r = atob((b64+"=".repeat((4-b64.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from([...r].map(c=>c.charCodeAt(0))); };
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
async function pushState(){
 if(!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return (isIOS && !isStandalone) ? "ios-install" : "unsupported";
 if(Notification.permission === "denied") return "denied";
 const reg = await navigator.serviceWorker.getRegistration();
 const sub = reg && await reg.pushManager.getSubscription();
 return sub ? "on" : "off";
}
async function activerPush(){
 const reg = await navigator.serviceWorker.register("sw.js");
 await navigator.serviceWorker.ready;
 if(await Notification.requestPermission() !== "granted") return;
 const sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:u8(VAPID_PUBLIC)});
 const j = sub.toJSON();
 const {error} = await sb.from("push_subscriptions").upsert({joueur_id:MY_ID, endpoint:j.endpoint, p256dh:j.keys.p256dh, auth_key:j.keys.auth}, {onConflict:"endpoint"});
 if(error) throw new Error(error.message);
}
async function desactiverPush(){
 const reg = await navigator.serviceWorker.getRegistration();
 const sub = reg && await reg.pushManager.getSubscription();
 if(sub){ await sb.from("push_subscriptions").delete().eq("endpoint", sub.endpoint); await sub.unsubscribe(); }
}
async function renderPushZone(){
 const z = document.getElementById("pushZone"); if(!z) return;
 const st = await pushState();
 const note = t => `<div style="font-size:12px;opacity:.9">${t}</div>`;
 z.innerHTML = st==="on" ? `<div style="font-size:13px;font-weight:600">🔔 Notifications activées sur cet appareil</div><a href="#" id="pushOff">Désactiver</a>`
  : st==="off" ? `<button id="pushOn" style="width:100%;padding:11px;border-radius:10px;border:none;background:#fff;color:var(--green);font-weight:700">🔔 Activer les notifications</button>`
  : st==="denied" ? note("Notifications bloquées : autorise-les dans les réglages de ton navigateur ou de ton appareil.")
  : st==="ios-install" ? note("Sur iPhone : touche Partager puis « Sur l'écran d'accueil », ouvre l'app depuis son icône, puis reviens ici pour activer les notifications.")
  : note("Notifications push indisponibles ici (essaie depuis l'app installée).");
 const on = document.getElementById("pushOn");
 if(on) on.onclick = async ()=>{ try{ await activerPush(); }catch(e){ alert("Activation impossible : "+e.message); } renderPushZone(); };
 const off = document.getElementById("pushOff");
 if(off) off.onclick = async e=>{ e.preventDefault(); await desactiverPush(); renderPushZone(); };
}
function openNotif(){
 document.getElementById("notifOv").innerHTML=`<div class="ov-head"><b>NOTIFICATIONS</b><button class="x" id="ncl">✕</button></div>
 ${notifs.length?notifs.map(n=>`<div class="nitem ${!n.lu?'unread':''}"><div>${n.message}<div class="t">${relTime(n.created_at)}</div></div><span class="del" data-del-notif="${n.id}">🗑</span></div>`).join("")
  :'<div class="nitem">Aucune notification pour l\'instant.</div>'}`;
 document.getElementById("notifOv").classList.add("open");
 document.getElementById("ncl").onclick=()=>document.getElementById("notifOv").classList.remove("open");
 document.querySelectorAll("[data-del-notif]").forEach(el=>el.onclick=()=>supprimerNotif(el.dataset.delNotif));
 const idsNonLues = notifs.filter(n=>!n.lu).map(n=>n.id);
 if(idsNonLues.length){
  sb.from("notifications").update({lu:true}).in("id", idsNonLues).then(()=>{
   notifs.forEach(n=>n.lu=true); render();
  });
 }
}

}

function applyTheme(t){ theme=t; document.documentElement.setAttribute("data-theme", t==="dark"?"dark":""); }
function setTheme(t){ applyTheme(t); try{ localStorage.setItem("parisasf_theme", t); }catch(_){} }
try{ applyTheme(localStorage.getItem("parisasf_theme")==="dark"?"dark":"light"); }catch(_){}
