.login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center;}
.login h1{font-size:26px;margin-bottom:6px;}
.login p{color:var(--muted);font-size:16px;margin-bottom:22px;}
.login input{width:100%;max-width:280px;padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:17px;margin-bottom:10px;}
.login button{width:100%;max-width:280px;padding:14px;border-radius:10px;border:none;background:var(--green);color:#fff;font-weight:700;font-size:17px;}
.login .msg{margin-top:14px;font-size:16px;color:var(--green);min-height:18px;}
.login .err{color:var(--red);}
:root{
 --bg:#ffffff; --card:#ffffff; --header:#0a1119; --line:#e6e9ec;
 --green:#02876c; --red:#ba0000; --grey:#ababab; --gold:#dda520;
 --text:#12181f; --muted:#6b7680; --chipbg:#f0f2f4;
}
[data-theme="dark"]{
 --bg:#0d1b2a; --card:#122a3e; --header:#070f18; --line:#1f3348;
 --text:#f2f5f7; --muted:#9fb0bf; --chipbg:#1a3049;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);}
#app{max-width:460px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);padding-top:calc(56px + env(safe-area-inset-top,0));padding-bottom:calc(64px + env(safe-area-inset-bottom,0));}
.topbar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;z-index:15;background:var(--header);color:#fff;padding:calc(12px + env(safe-area-inset-top,0)) 16px 12px;display:flex;align-items:center;justify-content:space-between;}
.topbar b{font-size:19px;letter-spacing:.5px;}
.topbar .right{display:flex;align-items:center;gap:14px;}
.iconbtn{position:relative;font-size:23px;cursor:pointer;background:none;border:none;color:#fff;}
.badge{position:absolute;top:-5px;right:-7px;background:var(--red);color:#fff;font-size:12px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
main{padding:14px 12px 20px;}
h2.title{text-align:center;font-weight:800;font-size:18px;letter-spacing:.5px;margin-bottom:10px;}
.sheet-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.mrow{display:flex;gap:12px;padding:12px 12px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer;}
.mrow:last-child{border-bottom:none;}
.dblock{width:54px;flex-shrink:0;border-radius:10px;padding:8px 0;text-align:center;color:#fff;}
.dblock b{display:block;font-size:23px;line-height:1;}
.dblock span{font-size:12px;text-transform:uppercase;}
.d-wait{background:var(--header);}
.d-no{background:var(--red);}
.d-yes{background:var(--green);}
.d-past{background:var(--grey);}
.minfo{flex:1;min-width:0;}
.comp{font-size:13px;color:var(--gold);display:flex;align-items:center;gap:4px;margin-bottom:2px;}
.trow{display:flex;justify-content:space-between;font-size:16px;font-weight:600;}

.venue{font-size:14px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;z-index:15;background:var(--header);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0));gap:6px;}

.teamrow{display:flex;justify-content:space-between;font-size:18px;font-weight:500;padding:5px 0;}
.teamrow.win{font-weight:800;}
h3.sect{text-align:center;font-size:14px;letter-spacing:1px;color:var(--muted);margin:14px 0 8px;text-transform:uppercase;}
.oui-non{display:flex;gap:10px;}

th{font-weight:800;text-align:center;padding:10px 2px;border-bottom:2px solid var(--line);cursor:pointer;user-select:none;}

.small{font-size:14px;color:var(--muted);}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;}
.tag.g{background:rgba(2,135,108,.15);color:var(--green);}
.tag.r{background:rgba(186,0,0,.12);color:var(--red);}

.seg{display:flex;gap:6px;}
.segbtn{min-width:60px;padding:10px 12px;border-radius:8px;border:none;font-weight:700;font-size:14px;background:var(--chipbg);color:var(--muted);cursor:pointer;}
.segbtn.on-yes{background:var(--green);color:#fff;}
.segbtn.on-no{background:var(--red);color:#fff;}
.chk{cursor:pointer;}
.chk input[type=checkbox]{width:24px;height:24px;accent-color:var(--green);flex-shrink:0;}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;}

.compact-summary{display:flex;justify-content:center;gap:14px;font-size:17px;font-weight:700;margin-bottom:12px;padding:10px;background:var(--chipbg);border-radius:8px;}
</style>

<script>
const SUPABASE_URL = "https://wwesvvclxvgktgchmwmf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3ZXN2dmNseHZna3RnY2htd21mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2ODIzMDcsImV4cCI6MjEwNjI1ODMwN30.4_SA-HnMKP73noJ6QOeUJJ8dViCOp3WzLhN-w7H8K2Q";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let ME="", MY_ID="", MY_EMAIL="", ROLE="joueur", currentTab="cal", currentMatch=null, theme="light";
let pendingMatch = new URLSearchParams(location.search).get("match");
const initials=n=>n.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cleanVenue=v=>(v||"").replace(/\s*\(ouvre l'itinéraire[^)]*\)\s*/gi,"").trim()||"Lieu à confirmer";
let effectif=[];

let mesPresencesLocales = {};

let clubSortKey = 'n';
let clubSortAsc = true;

function simplifierNom(nomComplet, listeNoms) {
 if(!nomComplet) return "";
 const parties = nomComplet.trim().split(/\s+/);
 if(parties.length === 1) return parties[0];
 const prenom = parties[0];
 const nomFamille = parties.slice(1).join(" ");
 
 if(!listeNoms || !Array.isArray(listeNoms) || listeNoms.length === 0) {
  return prenom;
 }
 
 const homonymes = listeNoms.filter(n => n && n !== nomComplet && n.trim().split(/\s+/)[0].toLowerCase() === prenom.toLowerCase());
 if (homonymes.length === 0) {
  return prenom; 
 }
 
 let longueurInitiale = 1;
 while (longueurInitiale <= nomFamille.length) {
  const initialeCourante = nomFamille.slice(0, longueurInitiale).trim();
  let conflit = false;
  for (let h of homonymes) {
   const hParties = h.trim().split(/\s+/);
   const hNom = hParties.slice(1).join(" ");
   if (hNom.slice(0, longueurInitiale).trim().toLowerCase() === initialeCourante.toLowerCase()) {
    conflit = true;
    break;
   }
  }
  if (!conflit) {
   return prenom + " " + initialeCourante.toUpperCase() + ".";
  }
  longueurInitiale++;
 }
 return prenom + " " + nomFamille;
}

function showConfirm(title, message, onConfirm) {
  const bg = document.createElement("div");
  bg.className = "modalbg";
  bg.style.zIndex = "999";
  bg.innerHTML = `
   <div class="modal">
    <h4>${esc(title)}</h4>
    <p>${esc(message)}</p>
    <div class="mbtns" style="margin-top:20px">
     <button class="mbtn" id="btnCancelConf">Annuler</button>
     <button class="mbtn primary" id="btnOkConf">Oui</button>
    </div>
   </div>
  `;
  document.body.appendChild(bg);
  document.getElementById("btnCancelConf").onclick = () => bg.remove();
  document.getElementById("btnOkConf").onclick = () => { bg.remove(); onConfirm(); };
}

async function loadJoueurEtDemarre(session){
 const email = session.user.email;
 const {data, error} = await sb.from("joueurs").select("id,nom,role").eq("email", email).eq("actif", true).maybeSingle();
 if(error || !data){
  document.getElementById("loginMsg").innerHTML = "Cet email ne fait pas partie de l'effectif enregistré.";
  document.getElementById("loginMsg").classList.add("err");
  await sb.auth.signOut();
  return;
 }
 ME = data.nom; MY_ID = data.id; ROLE = data.role; MY_EMAIL = email;
 const {data: tousJoueurs} = await sb.from("joueurs").select("id,nom,role").eq("actif", true);
 effectif = tousJoueurs||[];
 if(!effectif.some(j=>j.id===MY_ID)) effectif.push({id:MY_ID, nom:ME, role:ROLE});
 
 await loadDonneesFLA();
 await loadNotifications();
 
 document.getElementById("loginScreen").style.display="none";
 document.getElementById("app").style.display="block";
 render();

 recupererPresencesPourCouleurs();

 if(pendingMatch){ try{ history.replaceState(null, "", location.pathname); }catch(_){} }
 navReplace();
 if(pendingMatch){ const id = pendingMatch; pendingMatch = null; openMatchById(id); }
}

async function recupererPresencesPourCouleurs() {
 if (!MY_ID) return;
 try {
  const { data, error } = await sb.from("presences").select("match_id, statut").eq("joueur_id", MY_ID);
  if (!error && data) {
   mesPresencesLocales = {};
   data.forEach(p => {
    mesPresencesLocales[p.match_id] = p.statut;
   });
   if (currentTab === "cal" && !currentMatch) {
    render();
   }
  }
 } catch(e) {
  console.warn("Récupération des présences en tâche de fond échouée :", e);
 }
}

document.getElementById("loginBtn").onclick = async ()=>{
 const email = document.getElementById("loginEmail").value.trim();
 const msg = document.getElementById("loginMsg");
 msg.classList.remove("err");
 if(!email){ msg.textContent="Merci de saisir un email."; msg.classList.add("err"); return; }
 msg.textContent="Envoi en cours...";
 const {error} = await sb.auth.signInWithOtp({email, options:{emailRedirectTo: location.origin+location.pathname}});
 msg.textContent = error ? "Erreur : "+error.message : "Email envoyé ! Clique sur le lien, ou saisis ci-dessous le code reçu (utile dans l'app installée sur iPhone).";
 if(!error) document.getElementById("codeBox").style.display="block";
 if(error) msg.classList.add("err");
};
document.getElementById("codeBtn").onclick = async ()=>{
 const email = document.getElementById("loginEmail").value.trim();
 const token = document.getElementById("loginCode").value.trim();
 const msg = document.getElementById("loginMsg"); msg.classList.remove("err");
 const {error} = await sb.auth.verifyOtp({email, token, type:"email"});
 if(error){ msg.textContent = "Code invalide ou expiré."; msg.classList.add("err"); }
};
sb.auth.onAuthStateChange((event, session)=>{ if(session) loadJoueurEtDemarre(session); });
sb.auth.getSession().then(({data})=>{ if(data.session) loadJoueurEtDemarre(data.session); });

let matches=[], ranking=[];
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const fmtTime=d=>d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
const fmtDay=d=>d.getDate().toString().padStart(2,"0");
const fmtMonAbbr=d=>MOIS[d.getMonth()].slice(0,3)+".";
const fmtDateFull=d=>`${d.getDate()} ${MOIS[d.getMonth()].toUpperCase()} ${d.getFullYear()}`;

const sourceId = m => `${m.competition}|${m.domicile}|${m.exterieur}|${m.date}`;

async function loadDonneesFLA(){
 try{
  const [mRes, clRes] = await Promise.all([fetch("matches.json"), fetch("classement.json")]);
  const rawMatches = await mRes.json(), cl = await clRes.json();
  const {data: dbMatches} = await sb.from("matchs").select("id,source_id,feuille_validee,stats_remplies");
  const dbBySource = {}; (dbMatches||[]).forEach(r=>dbBySource[r.source_id]=r);
  matches = rawMatches.filter(m=>m.date).map((m,idx)=>{
   const row = dbBySource[sourceId(m)];

  m.validationDraft = {};
  effectif.forEach(j=>{
   const row = (pres||[]).find(r=>r.joueur_id===j.id);
   m.validationDraft[j.id] = m.feuilleValidee ? !!(row&&row.a_reellement_joue) : (row ? row.statut==="oui" : false);
  });
 }
 m.playersOk = m.feuilleValidee ? effectif.filter(j=>(pres||[]).some(r=>r.joueur_id===j.id && r.a_reellement_joue)) : [];

 const {data:statsRows} = await sb.from("stats_joueurs").select("joueur_id,buts,passes_decisives,gardien").eq("match_id", m.dbId);
 if(!m.statsDraft){

   const row = (statsRows||[]).find(r=>r.joueur_id===j.id);
   m.statsDraft[j.id] = {buts:row?row.buts:0, pd:row?row.passes_decisives:0, gardien:row?row.gardien:false};
  });
 }
 m.scoreOfficiel = m.home==="PARIS ASF" ? (m.score?m.score[0]:null) : (m.score?m.score[1]:null);

 const rv = await sb.rpc("etat_vote", {p_match:m.dbId});

 m.vote = ev ? {ouvert:!!ev.ouvert, clos:!!ev.clos, fermeLe:ev.ferme_le||null} : {ouvert:false, clos:false, fermeLe:null};
 const {data:votes} = await sb.from("votes_homme_du_match").select("votant_id,candidat_id").eq("match_id", m.dbId);

function majStatsInfo(avert){

 if(z){ z.textContent = avert || ""; z.style.display = avert ? "block" : "none"; }
 const N = m.scoreOfficiel; if(N===null) return;
 (m.playersOk||[]).forEach(j=>{
  const bt = document.querySelector(`[data-stat-buts="${j.id}"]`), pd = document.querySelector(`[data-stat-pd="${j.id}"]`);
  if(bt) bt.max = Math.max(0, N - totalStat(m,"buts",j.id));
  if(pd) pd.max = Math.max(0, N - totalStat(m,"pd",j.id));
 });
}
function onStatInput(el, champ, id){
 const m = currentMatch; if(!m || !m.statsDraft[id]) return;
 let v = el.value==="" ? 0 : Math.max(0, parseInt(el.value,10)||0), avert = "";
 if(m.scoreOfficiel!==null){
  const max = Math.max(0, m.scoreOfficiel - totalStat(m, champ, id));
  if(v>max){
   v = max; el.value = String(max);
   avert = `Maximum ${max} : le total des ${champ==="buts"?"buts":"passes décisives"} ne peut pas dépasser le score de l'équipe (${m.scoreOfficiel}).`;
  }
 }
 if(el.value!=="" && String(v)!==el.value) el.value = String(v);
 m.statsDraft[id][champ] = el.value==="" ? "" : v;
 majStatsInfo(avert);
}

let clubRows=null, clubErr=null;
async function refreshClubStats(){
 const ids = matches.filter(m=>m.dbId).map(m=>m.dbId);
 const [r1,r2,r3,r4] = await Promise.all([
  ids.length ? sb.from("presences").select("match_id,joueur_id").in("match_id", ids).eq("a_reellement_joue", true) : {data:[]},
  ids.length ? sb.from("stats_joueurs").select("match_id,joueur_id,buts,passes_decisives,gardien").in("match_id", ids) : {data:[]},
  ids.length ? sb.rpc("hommes_du_match", {p_matchs: ids}) : {data:[]},
  sb.from("joueurs").select("id,nom,actif"),
 ]);
 const err = [r1,r2,r3,r4].find(r=>r.error);
 if(err){ clubErr = err.error.message; return; }
 clubErr = null;
 const byId = {}; matches.forEach(m=>{ if(m.dbId) byId[m.dbId]=m; });
 const tot = {};
 const row = id => tot[id] || (tot[id] = {j:0,b:0,pd:0,gb:0,hm:0});
 const parMatch = {};
 (r1.data||[]).forEach(p=>{
  const m = byId[p.match_id]; if(!m || !m.feuilleValidee) return;
  row(p.joueur_id).j++; (parMatch[p.match_id] = parMatch[p.match_id] || []).push(p.joueur_id);
 });
 (r2.data||[]).forEach(st=>{
  const m = byId[st.match_id]; if(!m || !m.statsRemplies) return;
  const r = row(st.joueur_id); r.b += st.buts||0; r.pd += st.passes_decisives||0; if(st.gardien) r.gb++;
 });
 (r3.data||[]).forEach(h=>{ row(h.joueur_id).hm += h.hm; });
 
 const listeTousNoms = (r4.data||[]).map(j => j.nom);

 clubRows = (r4.data||[])
  .filter(j=>j.actif || (tot[j.id] && tot[j.id].j>0))
  .map(j=> {
    const rawName = j.nom;
    const simplified = simplifierNom(rawName, listeTousNoms);
    return Object.assign({id:j.id, rawName: rawName, n:simplified}, tot[j.id] || {j:0,b:0,pd:0,gb:0,hm:0});
  });
 trierClubRows();
}

function trierClubRows() {
 if (!clubRows) return;
 clubRows.sort((a,b) => {
   let valA = a[clubSortKey];
   let valB = b[clubSortKey];
   if (typeof valA === 'string') {
     return clubSortAsc ? valA.localeCompare(valB, "fr") : valB.localeCompare(valA, "fr");
   } else {
     return clubSortAsc ? valA - valB : valB - valA;
   }
 });
}

function changeClubSort(key) {
 if (clubSortKey === key) {
   clubSortAsc = !clubSortAsc;
 } else {
   clubSortKey = key;
   clubSortAsc = (key === 'n') ? true : false;
 }
 trierClubRows();
 render();
}

  } else if(!m.playersOk || m.playersOk.length===0){
   h+=`<div class="small" style="color:var(--muted)">Aucun joueur retenu sur ce match.</div>`;
  } else if(!(m.vote && m.vote.ouvert)){
   h+=`<div class="small" style="color:var(--muted)">Le vote s'ouvrira dès que la feuille de match et les stats seront validées.</div>`;
  } else if(!m.vote.clos){
   const jeSuisCandidat = m.playersOk.some(j=>j.id===MY_ID);
   if(jeSuisCandidat){
    h+=`<div class="small" style="margin-bottom:6px">Vote ouvert : tu peux le modifier jusqu'à la clôture.</div>`;
    h+=m.playersOk.filter(j=>j.id!==MY_ID).map(j=> {
      const nomSimplifie = simplifierNom(j.nom, effectif.map(x=>x.nom));
      return `<div class="voteopt"><span>${esc(nomSimplifie)}</span><button data-vote="${j.id}" class="${m.myVote===j.id?'yesOn':''}" style="${m.myVote===j.id?'background:var(--green);color:#fff':''}">${m.myVote===j.id?'Voté ✓':'Voter'}</button></div>`;
    }).join("");
   } else {
    h+=`<div class="small" style="color:var(--muted)">Seuls les joueurs de la feuille de match peuvent voter.</div>`;
   }
   const ferme = m.vote.fermeLe ? "le "+new Date(m.vote.fermeLe).toLocaleString("fr-FR",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}).replace(":","h") : "dans 48 h";
   h+=`<div style="font-size:14px;color:var(--muted);margin-top:8px">Résultats visibles à la clôture (${ferme}), ou dès que tous les joueurs de la feuille ont voté.</div>`;
  } else {
   const top = Object.entries(m.voteCounts||{}).sort((a,b)=>b[1]-a[1]);
   if(top.length){
    const max = top[0][1], winners = top.filter(([_,v])=>v===max);
    h+=`<div class="small" style="margin-bottom:6px">Vote clos.</div>`+winners.map(([id,v])=>{ const j = effectif.find(e=>e.id===id), nom = j?j.nom:"Joueur retiré";
     const nomSimplifie = simplifierNom(nom, effectif.map(x=>x.nom));
     return `<div class="winner"><div class="av">${esc(initials(nom))}</div><div><b>${esc(nomSimplifie)}</b><br><i>${v} vote${v>1?"s":""}</i></div></div>`; }).join("<br>");
   } else {
    h+=`<div class="small" style="color:var(--muted)">Vote clos : pas de vote → pas d'homme du match pour cette rencontre.</div>`;
   }
  }
  h+=`</div><h3 class="sect">Statistiques (${m.comp})</h3><div class="card" style="padding:8px">`;
  if(!m.playersOk || m.playersOk.length===0){
   h+=`<div class="small" style="color:var(--muted)">Pas encore de joueurs validés.</div>`;
  } else if(ROLE==="manager"){
   h+=`${m.scoreOfficiel!==null?`<div id="statsInfo" class="small" style="display:none;margin-bottom:8px;font-weight:700;color:var(--red)"></div>`:`<div class="small" style="margin-bottom:8px;color:var(--red)">Score officiel indisponible : contrôle impossible.</div>`}
   <table class="stats-match-table"><tr><th>Joueurs</th><th>B</th><th>PD</th><th>GB</th></tr>
   ${m.playersOk.map(j=>{if(!m.statsDraft[j.id]) m.statsDraft[j.id]={buts:0,pd:0,gardien:false}; const s=m.statsDraft[j.id];
    const nomSimplifie = simplifierNom(j.nom, effectif.map(x=>x.nom));
    return `<tr><td>${nomSimplifie}</td>
     <td><input type="number" min="0" value="${s.buts}" max="${m.scoreOfficiel!==null?m.scoreOfficiel:''}" inputmode="numeric" data-stat-buts="${j.id}" style="width:40px;text-align:center;background:var(--chipbg);color:var(--text);border:1px solid var(--line);border-radius:6px;font-size:16px"></td>
     <td><input type="number" min="0" value="${s.pd}" max="${m.scoreOfficiel!==null?m.scoreOfficiel:''}" inputmode="numeric" data-stat-pd="${j.id}" style="width:40px;text-align:center;background:var(--chipbg);color:var(--text);border:1px solid var(--line);border-radius:6px;font-size:16px"></td>
     <td><span data-stat-gardien="${j.id}" style="cursor:pointer">${s.gardien?'✓':'—'}</span></td></tr>`;}).join("")}
   </table>
   <button class="votebtn" style="margin-top:10px" data-save-stats="1">Enregistrer les stats</button>`;
  } else {
   h+=`<table class="stats-match-table"><tr><th>Joueurs</th><th>B</th><th>PD</th><th>GB</th></tr>
   ${m.playersOk.map(j=>{const s=m.statsDraft[j.id]||{buts:0,pd:0,gardien:false};
    const nomSimplifie = simplifierNom(j.nom, effectif.map(x=>x.nom));
    return `<tr><td>${nomSimplifie}</td><td>${s.buts}</td><td>${s.pd}</td><td>${s.gardien?'✓':'—'}</td></tr>`;}).join("")}
   </table>`;
  }
  h+=`</div>`;
  if(m.feuilleValidee) h += feuilleHtml;
 }
 return h;
}

function render(){
 document.getElementById("main").innerHTML = currentMatch ? viewMatch(currentMatch)
  : currentTab==="cal" ? viewCal() : currentTab==="rank" ? viewRank() : viewClub();
 [...document.querySelectorAll("nav button")].forEach(b=>b.classList.toggle("active", !currentMatch && b.dataset.tab===currentTab));
 document.getElementById("avatarBtn").textContent = initials(ME);
 const unread = notifs.filter(n=>!n.lu).length;
 const badge = document.getElementById("bellBadge");
 badge.style.display = unread?"flex":"none"; badge.textContent = unread;
 bind();

 appliqCouleursCalendrier();

 if(currentTab==="cal" && !currentMatch){
  if(savedScroll!==null){ try{ window.scrollTo(0, savedScroll); }catch(_){} savedScroll = null; }
  else { const nm = document.getElementById("nextMatch"); if(nm) nm.scrollIntoView({block:"center"}); }
 }
}

function appliqCouleursCalendrier(){
 if(currentTab !== "cal" || currentMatch) return;
 document.querySelectorAll("[data-color-match]").forEach(el => {
  const dbId = el.dataset.colorMatch;
  if(!dbId) return;
  
  const m = matches.find(x => x.dbId === dbId);
  const statut = mesPresencesLocales[dbId];
  
  el.className = "dblock";
  
  if(m && m.status === "past") {
   el.classList.add("d-past");
  } else if(statut === "oui") {
   el.classList.add("d-yes");
  } else if(statut === "non") {
   el.classList.add("d-no");
  } else {
   el.classList.add("d-wait");
  }
 });
}

let navDepth = 0, overlay = null, pendingTab = null, savedScroll = null;
const uiState = ()=>({d:navDepth, tab:currentTab, match:currentMatch?currentMatch.id:null, overlay,
  modal: !!document.querySelector(".modalbg") || document.getElementById("sheet").classList.contains("open")});
function navPush(){ navDepth++; try{ history.pushState(uiState(), ""); return true; }catch(_){ navDepth--; return false; } }
function navReplace(){ try{ history.replaceState(uiState(), ""); }catch(_){} }
function navBack(direct){ if(navDepth>0) history.back(); else direct(); }
function closeSheet(){ document.getElementById("sheet").classList.remove("open"); document.getElementById("ov2").classList.remove("open"); }
window.addEventListener("popstate", e=>{
 if(!ME) return;
 const st = e.state || {d:0, tab:"cal", match:null, overlay:null, modal:false};
 navDepth = st.d || 0;
 if(!st.modal){ document.querySelectorAll(".modalbg").forEach(x=>x.remove()); closeSheet(); }
 document.getElementById("notifOv").classList.remove("open"); document.getElementById("profOv").classList.remove("open"); overlay = null;
 currentTab = st.tab || "cal";
 currentMatch = st.match ? (matches.find(m=>m.id===st.match) || null) : null;
 render();
 if(pendingTab){ const t = pendingTab; pendingTab = null; if(t!=="cal") goTab(t); }
});
function goTab(t){
 savedScroll = null;
 if(currentMatch){
  if(navDepth>0){ pendingTab = t; history.go(-navDepth); return; }
  currentMatch = null;
 }
 if(t===currentTab){ render(); }
 else if(t==="cal"){ if(navDepth>0){ history.back(); return; } currentTab = "cal"; render(); }
 else { currentTab = t; if(navDepth===0) navPush(); else navReplace(); render(); }
 if(currentTab==="club") refreshClubStats().then(()=>{ if(currentTab==="club" && !currentMatch) render(); });
}
async function openMatch(m, {replace=false}={}){
 if(!m) return;
 if(!currentMatch && currentTab==="cal") savedScroll = window.scrollY;
 currentMatch = m; render();
 if(replace) navReplace(); else navPush();
 try{ window.scrollTo(0,0); }catch(_){}
 if(m.dbId){
  if(m.status==="upcoming") await loadPresences(m); else await loadPastMatchData(m);
  if(currentMatch===m) render();
 }
}
function openMatchById(dbId, opts){
 const m = matches.find(x=>x.dbId===dbId);
 if(m) openMatch(m, opts); else alert("Ce match n'est plus disponible dans le calendrier.");
}
function handleSwMessage(ev){
 if(!ev.data || ev.data.type!=="navigate") return;
 const id = new URL(ev.data.url, location.href).searchParams.get("match");
 if(!id) return;
 if(!ME){ pendingMatch = id; return; }
 openMatchById(id);
}
if("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", handleSwMessage);

function bind(){
 document.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>openMatch(matches.find(m=>m.id==el.dataset.open)));
 const bk=document.querySelector("[data-back]"); if(bk) bk.onclick=()=>navBack(()=>{ currentMatch=null; render(); });
 document.querySelectorAll("[data-pres]").forEach(b=>b.onclick=()=>setPresence(currentMatch, b.dataset.pres));
 document.querySelectorAll("[data-mgr-pres]").forEach(b=>b.onclick=()=>setPresenceManager(currentMatch, b.dataset.mgrPres, b.dataset.mgrVal));
 document.querySelectorAll("[data-vote]").forEach(b=>b.onclick=()=>voter(currentMatch, b.dataset.vote));
 document.querySelectorAll("[data-toggle-joue]").forEach(el=>el.onchange=()=>{
  currentMatch.validationDraft[el.dataset.toggleJoue] = el.checked;
  render();
 });
 const vf=document.querySelector("[data-valider-feuille]"); if(vf) vf.onclick=()=>validerFeuille(currentMatch);
 document.querySelectorAll("[data-stat-buts]").forEach(el=>el.oninput=()=>onStatInput(el,"buts",el.dataset.statButs));
 document.querySelectorAll("[data-stat-pd]").forEach(el=>el.oninput=()=>onStatInput(el,"pd",el.dataset.statPd));
 majStatsInfo("");
 document.querySelectorAll("[data-stat-gardien]").forEach(el=>el.onclick=()=>{
  const id=el.dataset.statGardien; currentMatch.statsDraft[id].gardien=!currentMatch.statsDraft[id].gardien; render();
 });
 const ss=document.querySelector("[data-save-stats]"); if(ss) ss.onclick=()=>enregistrerStats(currentMatch);
 const v=document.querySelector("[data-venue]"); if(v) v.onclick=()=>openVenueMenu(currentMatch.venue);
 const ag=document.querySelector("[data-agenda]"); if(ag) ag.onclick=openAgendaMenu;
}
function openSheet(opts){
 const s=document.getElementById("sheet"), o=document.getElementById("ov2");
 const items=opts.map(x=>typeof x==="string"?{label:x}:x);
 s.innerHTML=items.map(x=>`<div class="opt">${x.label}</div>`).join("")+`<div class="opt">Annuler</div>`;
 s.classList.add("open"); o.classList.add("open");
 let pushed = navPush();
 const close=()=>{ closeSheet(); if(pushed){ pushed = false; history.back(); } };
 o.onclick=close;
 s.querySelectorAll(".opt").forEach((el,i)=>el.onclick=()=>{ close(); if(items[i]&&items[i].run) items[i].run(); });
}
function openVenueMenu(venue){
 const q=encodeURIComponent(venue);
 openSheet([
  {label:"Ouvrir dans Google Maps", run:()=>window.open(`https://www.google.com/maps/search/?api=1&query=${q}`,"_blank")},
  {label:"Ouvrir dans Waze", run:()=>window.open(`https://waze.com/ul?q=${q}&navigate=yes`,"_blank")},
  {label:"Ouvrir dans Apple Plans", run:()=>window.open(`https://maps.apple.com/?q=${q}`,"_blank")},
 ]);
}
function openAgendaMenu(){
 const https=new URL("calendrier.ics", location.href).href;
 const webcal=https.replace(/^https?:/,"webcal:");
 openSheet([
  {label:"S'abonner (iPhone, Mac, Android)", run:()=>{ window.location.href=webcal; }},
  {label:"Copier le lien (Google Agenda, Outlook…)", run:()=>{
    (navigator.clipboard?navigator.clipboard.writeText(https):Promise.reject()).then(()=>alert("Lien copié !")).catch(()=>prompt("Copie ce lien :", https));
  }},
 ]);
}
const VAPID_PUBLIC = "BDtnsQ82oKQ9B3oUuFY0FOWWs8h5M2zGxOSD38ol4ykrbdHE9XqgClg-01qNo7O9jH4gJ3pv0xCEUvUG_lmHrok";
const u8 = b64 => { const r = atob((b64+"=".repeat((4-b64.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from([...r].map(c=>c.charCodeAt(0))); };
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
async function pushState(){
 if(!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return (isIOS && !isStandalone) ? "ios-install" : "unsupported";
 if(Notification.permission === "denied") return "denied";
 const reg = await navigator.serviceWorker.getRegistration();
 const sub = reg && await reg.pushManager.getSubscription();
 return sub ? "on" : "off";
}
async function activerPush(){
 const reg = await navigator.serviceWorker.register("sw.js");
 await navigator.serviceWorker.ready;
 if(await Notification.requestPermission() !== "granted") return;
 const sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:u8(VAPID_PUBLIC)});
 const j = sub.toJSON();
 const {error} = await sb.from("push_subscriptions").upsert({joueur_id:MY_ID, endpoint:j.endpoint, p256dh:j.keys.p256dh, auth_key:j.keys.auth}, {onConflict:"endpoint"});
 if(error) throw new Error(error.message);
}
async function desactiverPush(){
 const reg = await navigator.serviceWorker.getRegistration();
 const sub = reg && await reg.pushManager.getSubscription();
 if(sub){ await sb.from("push_subscriptions").delete().eq("endpoint", sub.endpoint); await sub.unsubscribe(); }
}
async function renderPushZone(){
 const z = document.getElementById("pushZone"); if(!z) return;
 const st = await pushState();
 const note = t => `<div style="font-size:14px;opacity:.9">${t}</div>`;
 z.innerHTML = st==="on" ? `<div style="font-size:16px;font-weight:600">🔔 Notifications activées sur cet appareil</div><a href="#" id="pushOff" style="font-size:16px">Désactiver</a>`
  : st==="off" ? `<button id="pushOn" style="width:100%;padding:14px;border-radius:10px;border:none;background:#fff;color:var(--green);font-weight:700;font-size:17px">🔔 Activer les notifications</button>`
  : st==="denied" ? note("Notifications bloquées : autorise-les dans les réglages de ton navigateur ou de ton appareil.")
  : st==="ios-install" ? note("Sur iPhone : touche Partager puis « Sur l'écran d'accueil », ouvre l'app depuis son icône, puis reviens ici pour activer les notifications.")
  : note("Notifications push indisponibles ici (essaie depuis l'app installée).");
 const on = document.getElementById("pushOn");
 if(on) on.onclick = async ()=>{ try{ await activerPush(); }catch(e){ alert("Activation impossible : "+e.message); } renderPushZone(); };
 const off = document.getElementById("pushOff");
 if(off) off.onclick = async e=>{ e.preventDefault(); await desactiverPush(); renderPushZone(); };
}
function openNotif(){
 document.getElementById("notifOv").innerHTML=`<div class="ov-head"><b>NOTIFICATIONS</b><button class="x" id="ncl">✕</button></div>
 ${notifs.length?notifs.map(n=>`<div class="nitem ${!n.lu?'unread':''}"${n.match_id?` data-notif-match="${n.match_id}" style="cursor:pointer"`:''}><div>${esc(n.message)}<div class="t">${relTime(n.created_at)}${n.match_id?' · Voir le match ›':''}</div></div><span class="del" data-del-notif="${n.id}">🗑</span></div>`).join("")
  :'<div class="nitem">Aucune notification pour l\'instant.</div>'}`;
 document.getElementById("notifOv").classList.add("open");
 if(overlay!=="notif"){ overlay = "notif"; navPush(); }
 document.getElementById("ncl").onclick=()=>navBack(()=>{ document.getElementById("notifOv").classList.remove("open"); overlay = null; });
 document.querySelectorAll("[data-notif-match]").forEach(el=>el.onclick=()=>{
  document.getElementById("notifOv").classList.remove("open"); overlay = null; navReplace();
  openMatchById(el.dataset.notifMatch, {replace:true});
 });
 document.querySelectorAll("[data-del-notif]").forEach(el=>el.onclick=e=>{ e.stopPropagation(); supprimerNotif(el.dataset.delNotif); });
 const idsNonLues = notifs.filter(n=>!n.lu).map(n=>n.id);
 if(idsNonLues.length){
  sb.from("notifications").update({lu:true}).in("id", idsNonLues).then(()=>{
   notifs.forEach(n=>n.lu=true); render();
  });
 }
}
function openProfil(){
 document.getElementById("profOv").innerHTML=`<div class="profov">
  <div class="ov-head"><b></b><button class="x" id="pcl">✕</button></div>
  <div style="font-weight:800;letter-spacing:1px;margin-top:-30px">PROFIL</div>
  <div class="av2">${initials(ME)}</div><h4>${ME.toUpperCase()}</h4><a>${MY_EMAIL}</a>
  <div id="pushZone" style="margin:22px 20px 0"></div>
  <div style="font-size:14px;opacity:.9;margin-top:20px">Thème</div>
  <div class="roleswitch" style="margin-top:6px">
   <button data-theme-set="light" class="${theme==='light'?'on':''}">☀️ Clair</button>
   <button data-theme-set="dark" class="${theme==='dark'?'on':''}">🌙 Sombre</button>
  </div>
  <div class="deco"><a href="#" id="logoutLink">Se déconnecter</a></div>
 </div>`;
 document.getElementById("profOv").classList.add("open");
 if(overlay!=="profil"){ overlay = "profil"; navPush(); }
 renderPushZone();
 document.querySelectorAll("[data-theme-set]").forEach(b=>b.onclick=()=>{
  setTheme(b.dataset.themeSet);
  document.querySelectorAll("[data-theme-set]").forEach(x=>x.classList.toggle("on", x===b));
 });
 document.getElementById("pcl").onclick=()=>navBack(()=>{ document.getElementById("profOv").classList.remove("open"); overlay = null; });
 document.getElementById("logoutLink").onclick=async (e)=>{e.preventDefault(); await sb.auth.signOut(); location.reload();};
}
document.getElementById("bellBtn").onclick=openNotif;
document.getElementById("avatarBtn").onclick=openProfil;
function applyTheme(t){ theme=t; document.documentElement.setAttribute("data-theme", t==="dark"?"dark":""); }
function setTheme(t){ applyTheme(t); try{ localStorage.setItem("parisasf_theme", t); }catch(_){} }
try{ applyTheme(localStorage.getItem("parisasf_theme")==="dark"?"dark":"light"); }catch(_){}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>goTab(b.dataset.tab));
</script>
