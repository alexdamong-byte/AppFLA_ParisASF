<style>
.login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center;}
.login h1{font-size:22px;margin-bottom:6px;}
.login p{color:var(--muted);font-size:13px;margin-bottom:22px;}
.login input{width:100%;max-width:280px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px;margin-bottom:10px;}
.login button{width:100%;max-width:280px;padding:12px;border-radius:10px;border:none;background:var(--green);color:#fff;font-weight:700;font-size:14px;}
.login .msg{margin-top:14px;font-size:13px;color:var(--green);min-height:18px;}
.login .err{color:var(--red);}
:root{
 --bg:#ffffff; --card:#ffffff; --header:#0a1119; --line:#e6e9ec;
 --green:#02876c; --red:#ba0000; --grey:#ababab; --gold:#dda520;
 --text:#12181f; --muted:#6b7680; --chipbg:#f0f2f4;
}
[data-theme="dark"]{
 --bg:#0d1b2a; --card:#122a3e; --header:#070f18; --line:#1f3348;
 --text:#f2f5f7; --muted:#9fb0bf; --chipbg:#1a3049;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);}
#app{max-width:460px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);padding-top:calc(56px + env(safe-area-inset-top,0));padding-bottom:calc(64px + env(safe-area-inset-bottom,0));}
.topbar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;z-index:15;background:var(--header);color:#fff;padding:calc(12px + env(safe-area-inset-top,0)) 16px 12px;display:flex;align-items:center;justify-content:space-between;}
.topbar b{font-size:16px;letter-spacing:.5px;}
.topbar .right{display:flex;align-items:center;gap:14px;}
.iconbtn{position:relative;font-size:19px;cursor:pointer;background:none;border:none;color:#fff;}
.badge{position:absolute;top:-5px;right:-7px;background:var(--red);color:#fff;font-size:10px;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
main{padding:14px 12px 20px;}
h2.title{text-align:center;font-weight:800;font-size:15px;letter-spacing:.5px;margin-bottom:10px;}
.sheet-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.mrow{display:flex;gap:12px;padding:12px 12px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer;}
.mrow:last-child{border-bottom:none;}
.dblock{width:54px;flex-shrink:0;border-radius:10px;padding:8px 0;text-align:center;color:#fff;}
.dblock b{display:block;font-size:19px;line-height:1;}
.dblock span{font-size:10px;text-transform:uppercase;}
.d-wait{background:var(--header);}
.d-no{background:var(--red);}
.d-yes{background:var(--green);}
.d-past{background:var(--grey);}
.minfo{flex:1;min-width:0;}
.comp{font-size:11px;color:var(--gold);display:flex;align-items:center;gap:4px;margin-bottom:2px;}
.trow{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;}
.trow.win{font-weight:800;}
.venue{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;z-index:15;background:var(--header);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0));gap:6px;}
nav button{flex:1;background:none;border:none;color:#b9c3cc;font-size:11px;padding:8px 0;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:3px;}
nav button.active{background:var(--green);color:#fff;}
.backbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.backbar .bk{font-size:20px;cursor:pointer;color:var(--text);background:none;border:none;}
.mhead{text-align:center;padding:2px 0 14px;}
.mhead .dt{font-weight:800;font-size:16px;}
.mhead .tm{font-weight:800;font-size:16px;}
.mhead a{color:var(--green);font-size:13px;display:block;margin-top:4px;text-decoration:underline;cursor:pointer;}
.mhead .comp2{font-size:12px;color:var(--gold);margin-top:4px;display:flex;justify-content:center;gap:4px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
.teamrow{display:flex;justify-content:space-between;font-size:15px;font-weight:500;padding:5px 0;}
.teamrow.win{font-weight:800;}
h3.sect{text-align:center;font-size:12px;letter-spacing:1px;color:var(--muted);margin:14px 0 8px;text-transform:uppercase;}
.oui-non{display:flex;gap:10px;}
.oui-non button{flex:1;padding:11px;border-radius:10px;border:none;font-weight:700;background:var(--chipbg);color:var(--text);}
.oui-non button.yesOn{background:var(--green);color:#fff;}

.pgroup{margin-top:14px;}
.pgroup .cnt{display:flex;gap:8px;align-items:baseline;font-weight:800;margin-bottom:4px;}
.cnt.g{color:var(--green);} .cnt.r{color:var(--red);} .cnt.gy{color:var(--muted);}
.pgroup .names{font-size:13px;color:var(--text);line-height:1.6;padding-left:2px;}
.votebtn{display:block;width:100%;background:var(--green);color:#fff;border:none;padding:13px;border-radius:10px;font-weight:700;font-size:14px;}
.voteopt{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);}
.voteopt button{background:var(--chipbg);border:none;color:var(--green);font-weight:700;padding:6px 12px;border-radius:8px;}
.winner{display:flex;align-items:center;gap:10px;}
.winner .av{width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}

table{width:100%;border-collapse:collapse;font-size:14px;} /* Agrandissement police table globale à 14px */
th{font-weight:800;text-align:center;padding:10px 4px;border-bottom:2px solid var(--line);cursor:pointer;user-select:none;}
td{text-align:center;padding:10px 4px;border-bottom:1px solid var(--line);}

th:nth-child(2),td:nth-child(2){text-align:center;}

.deco{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom,0));left:0;right:0;text-align:center;}
.roleswitch{display:flex;gap:8px;justify-content:center;margin-top:22px;padding:0 20px;}
.roleswitch button{flex:1;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.5);background:none;color:#fff;font-size:12px;font-weight:600;}
.roleswitch button.on{background:#fff;color:var(--green);}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);color:var(--text);border-radius:16px 16px 0 0;max-width:460px;margin:0 auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0));display:none;z-index:40;}
.sheet.open{display:block;}
.ov2{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:39;}
.ov2.open{display:block;}
.sheet .opt{padding:13px 4px;font-size:15px;border-bottom:1px solid var(--line);}
.sheet .opt:last-child{border:none;color:var(--red);text-align:center;}
.small{font-size:12px;color:var(--muted);}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
.tag.g{background:rgba(2,135,108,.15);color:var(--green);}
.tag.r{background:rgba(186,0,0,.12);color:var(--red);}
.tag.grey{background:var(--chipbg);color:var(--muted);}
.seg{display:flex;gap:6px;}
.segbtn{min-width:54px;padding:9px 10px;border-radius:8px;border:none;font-weight:700;font-size:12px;background:var(--chipbg);color:var(--muted);cursor:pointer;}
.segbtn.on-yes{background:var(--green);color:#fff;}
.segbtn.on-no{background:var(--red);color:#fff;}
.chk{cursor:pointer;}
.chk input[type=checkbox]{width:22px;height:22px;accent-color:var(--green);flex-shrink:0;}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;}

.modal p{font-size:13.5px;color:var(--muted);line-height:1.45;}
.mbtns{display:flex;gap:10px;}
.mbtn{flex:1;padding:12px;border-radius:10px;border:none;font-weight:700;font-size:14px;background:var(--chipbg);color:var(--text);cursor:pointer;}
.mbtn.danger{background:var(--red);color:#fff;}
.mbtn.primary{background:var(--green);color:#fff;}
.mbtn:disabled{opacity:.4;cursor:not-allowed;}
.delbtn{background:none;border:none;font-size:18px;padding:6px 8px;cursor:pointer;color:var(--red);}
.compact-summary{display:flex;justify-content:center;gap:14px;font-size:14px;font-weight:700;margin-bottom:12px;padding:8px;background:var(--chipbg);border-radius:8px;}
</style>

<script>
const SUPABASE_URL = "https://wwesvvclxvgktgchmwmf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3ZXN2dmNseHZna3RnY2htd21mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2ODIzMDcsImV4cCI6MjEwNjI1ODMwN30.4_SA-HnMKP73noJ6QOeUJJ8dViCOp3WzLhN-w7H8K2Q";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let ME="", MY_ID="", MY_EMAIL="", ROLE="joueur", currentTab="cal", currentMatch=null, theme="light";
let pendingMatch = new URLSearchParams(location.search).get("match");
const initials=n=>n.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cleanVenue=v=>(v||"").replace(/\s*\(ouvre l'itinéraire[^)]*\)\s*/gi,"").trim()||"Lieu à confirmer";
let effectif=[]; // [{id, nom}]

// Tableau local pour stocker nos présences récupérées en tâche de fond pour l'affichage de la couleur
let mesPresencesLocales = {};

// Paramètres de tri pour l'onglet Club
let clubSortKey = 'n'; // tri par défaut par prénom
let clubSortAsc = true;

// Fonction de simplification des noms de l'effectif
function simplifierNom(nomComplet, listeNoms) {
 if(!nomComplet) return "";
 const parties = nomComplet.trim().split(/\s+/);
 if(parties.length === 1) return parties[0];
 const prenom = parties[0];
 const nomFamille = parties.slice(1).join(" ");
 
 // Trouver s'il y a d'autres joueurs avec le même prénom dans la liste
 const homonymes = listeNoms.filter(n => n !== nomComplet && n.trim().split(/\s+/)[0].toLowerCase() === prenom.toLowerCase());
 if (homonymes.length === 0) {
  return prenom; // Prénom unique
 }
 
 // S'il y a des homonymes, on ajoute l'initiale et on allonge au besoin pour lever l'ambiguïté
 let longueurInitiale = 1;
 while (longueurInitiale <= nomFamille.length) {
  const initialeCourante = nomFamille.slice(0, longueurInitiale).trim();
  let conflit = false;
  for (let h of homonymes) {
   const hParties = h.trim().split(/\s+/);
   const hNom = hParties.slice(1).join(" ");
   if (hNom.slice(0, longueurInitiale).trim().toLowerCase() === initialeCourante.toLowerCase()) {
    conflit = true;
    break;
   }
  }
  if (!conflit) {
   return prenom + " " + initialeCourante.toUpperCase() + ".";
  }
  longueurInitiale++;
 }
 return prenom + " " + nomFamille;
}

async function loadJoueurEtDemarre(session){
 const email = session.user.email;
 const {data, error} = await sb.from("joueurs").select("id,nom,role").eq("email", email).eq("actif", true).maybeSingle();
 if(error || !data){
  document.getElementById("loginMsg").innerHTML = "Cet email ne fait pas partie de l'effectif enregistré.";
  document.getElementById("loginMsg").classList.add("err");
  await sb.auth.signOut();
  return;
 }
 ME = data.nom; MY_ID = data.id; ROLE = data.role; MY_EMAIL = email;
 const {data: tousJoueurs} = await sb.from("joueurs").select("id,nom,role").eq("actif", true);
 effectif = tousJoueurs||[];
 if(!effectif.some(j=>j.id===MY_ID)) effectif.push({id:MY_ID, nom:ME, role:ROLE});
 
 // On charge la version originale sans requêtes bloquantes
 await loadDonneesFLA();
 await loadNotifications();
 
 document.getElementById("loginScreen").style.display="none";
 document.getElementById("app").style.display="block";
 render();

 // Chargement des présences en tâche de fond de manière totalement asynchrone et sécurisée
 recupererPresencesPourCouleurs();

 if(pendingMatch){ try{ history.replaceState(null, "", location.pathname); }catch(_){} }
 navReplace();
 if(pendingMatch){ const id = pendingMatch; pendingMatch = null; openMatchById(id); }
}

// Fonction asynchrone isolée qui s'occupe de récupérer les présences pour colorier le calendrier
async function recupererPresencesPourCouleurs() {
 if (!MY_ID) return;
 try {
  const { data, error } = await sb.from("presences").select("match_id, statut").eq("joueur_id", MY_ID);
  if (!error && data) {
   mesPresencesLocales = {};
   data.forEach(p => {
    mesPresencesLocales[p.match_id] = p.statut;
   });
   // Met à jour l'affichage si on est sur l'onglet calendrier
   if (currentTab === "cal" && !currentMatch) {
    render();
   }
  }
 } catch(e) {
  console.warn("Récupération des présences en tâche de fond échouée (sans impact sur l'app) :", e);
 }
}

document.getElementById("loginBtn").onclick = async ()=>{
 const email = document.getElementById("loginEmail").value.trim();
 const msg = document.getElementById("loginMsg");
 msg.classList.remove("err");
 if(!email){ msg.textContent="Merci de saisir un email."; msg.classList.add("err"); return; }
 msg.textContent="Envoi en cours...";
 const {error} = await sb.auth.signInWithOtp({email, options:{emailRedirectTo: location.origin+location.pathname}});
 msg.textContent = error ? "Erreur : "+error.message : "Email envoyé ! Clique sur le lien, ou saisis ci-dessous le code reçu (utile dans l'app installée sur iPhone).";
 if(!error) document.getElementById("codeBox").style.display="block";
 if(error) msg.classList.add("err");
};
document.getElementById("codeBtn").onclick = async ()=>{
 const email = document.getElementById("loginEmail").value.trim();
 const token = document.getElementById("loginCode").value.trim();
 const msg = document.getElementById("loginMsg"); msg.classList.remove("err");
 const {error} = await sb.auth.verifyOtp({email, token, type:"email"});
 if(error){ msg.textContent = "Code invalide ou expiré."; msg.classList.add("err"); }
};
sb.auth.onAuthStateChange((event, session)=>{ if(session) loadJoueurEtDemarre(session); });
sb.auth.getSession().then(({data})=>{ if(data.session) loadJoueurEtDemarre(data.session); });

let matches=[], ranking=[];
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const fmtTime=d=>d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
const fmtDay=d=>d.getDate().toString().padStart(2,"0");
const fmtMonAbbr=d=>MOIS[d.getMonth()].slice(0,3)+".";
const fmtDateFull=d=>`${d.getDate()} ${MOIS[d.getMonth()].toUpperCase()} ${d.getFullYear()}`;

const sourceId = m => `${m.competition}|${m.domicile}|${m.exterieur}|${m.date}`;

async function loadDonneesFLA(){
 try{
  const [mRes, clRes] = await Promise.all([fetch("matches.json"), fetch("classement.json")]);
  const rawMatches = await mRes.json(), cl = await clRes.json();
  const {data: dbMatches} = await sb.from("matchs").select("id,source_id,feuille_validee,stats_remplies");
  const dbBySource = {}; (dbMatches||[]).forEach(r=>dbBySource[r.source_id]=r);
  matches = rawMatches.filter(m=>m.date).map((m,idx)=>{
   const row = dbBySource[sourceId(m)];
   return {id:`${idx}-${m.date}`, dbId: row?row.id:null, feuilleValidee: row?!!row.feuille_validee:false,
    statsRemplies: row?!!row.stats_remplies:false,
    comp:m.competition, dt:new Date(m.date), home:m.domicile, away:m.exterieur,
    venue:cleanVenue(m.venue), status:m.statut, score:m.score};
  }).sort((a,b)=>a.dt-b.dt);
  ranking = cl.map(r=>({p:r.equipe, pt:r.points, j:r.joues, g:r.gagnes, n:r.nuls, l:r.perdus, me:r.equipe==="PARIS ASF"}))
   .sort((a,b)=>b.pt-a.pt);
 }catch(e){ console.error("Chargement FLA impossible", e); }
}
let notifs=[];
function relTime(iso){
 const diff = Date.now()-new Date(iso).getTime();
 const h = Math.floor(diff/3600000);
 if(h<1) return "À l'instant";
 if(h<24) return `Il y a ${h}h`;
 const j = Math.floor(h/24);
 return j===1?"Hier":`Il y a ${j} jours`;
}
async function loadNotifications(){
 const {data} = await sb.from("notifications").select("id,match_id,message,lu,created_at").eq("joueur_id", MY_ID).order("created_at",{ascending:false}).limit(30);
 notifs = data||[];
}
async function supprimerNotif(id){
 await sb.from("notifications").delete().eq("id", id);
 notifs = notifs.filter(n=>n.id!==id);
 openNotif();
}

function groupCounts(m){
 const g={yes:[],no:[],wait:[]};
 effectif.forEach(j=>{const p=(m.presenceReal||{})[j.id]; g[p==="oui"?"yes":p==="non"?"no":"wait"].push(j.nom);});
 return g;
}
async function loadPresences(m){
 if(!m.dbId) return;
 const {data} = await sb.from("presences").select("joueur_id,statut").eq("match_id", m.dbId);
 m.presenceReal = {}; (data||[]).forEach(r=>m.presenceReal[r.joueur_id]=r.statut);
}
async function setPresence(m, statut){
 if(!m.dbId) return;
 const {error} = await sb.from("presences").upsert(
  {match_id:m.dbId, joueur_id:MY_ID, statut, updated_at:new Date().toISOString()},
  {onConflict:"match_id,joueur_id"}
 );
 if(error){ alert("Enregistrement impossible : "+error.message); return; }
 
 // Mise à jour de notre cache local de présences pour colorier l'encart date instantanément
 mesPresencesLocales[m.dbId] = statut;
 
 await loadPresences(m); render();
}

async function refreshEffectif(){
 const {data} = await sb.from("joueurs").select("id,nom,role").eq("actif", true);
 effectif = data||[];
 if(!effectif.some(j=>j.id===MY_ID)) effectif.push({id:MY_ID, nom:ME, role:ROLE});
}

async function setPresenceManager(m, joueurId, statut){
 if(ROLE !== "manager") {
  alert("Action refusée : Seuls les managers peuvent modifier la présence des autres joueurs.");
  return;
 }
 const j = effectif.find(e=>e.id===joueurId);
 const nomJoueur = j ? simplifierNom(j.nom, effectif.map(x=>x.nom)) : "ce joueur";
 if (!confirm(`Es-tu sûr de vouloir changer la présence de ${nomJoueur} ?`)) {
  return;
 }
 const {error} = await sb.from("presences").upsert(
  {match_id:m.dbId, joueur_id:joueurId, statut, updated_at:new Date().toISOString()},
  {onConflict:"match_id,joueur_id"}
 );
 if(error){ alert("Modification impossible : "+error.message); return; }
 if(joueurId === MY_ID){
  mesPresencesLocales[m.dbId] = statut;
 }
 await loadPresences(m); render();
}

async function loadPastMatchData(m){
 if(!m.dbId) return;
 const {data:pres} = await sb.from("presences").select("joueur_id,statut,a_reellement_joue").eq("match_id", m.dbId);
 m.presenceAll = pres||[];
 if(!m.validationDraft){
  m.validationDraft = {};
  effectif.forEach(j=>{
   const row = (pres||[]).find(r=>r.joueur_id===j.id);
   m.validationDraft[j.id] = m.feuilleValidee ? !!(row&&row.a_reellement_joue) : (row ? row.statut==="oui" : false);
  });
 }
 m.playersOk = m.feuilleValidee ? effectif.filter(j=>(pres||[]).some(r=>r.joueur_id===j.id && r.a_reellement_joue)) : [];

 const {data:statsRows} = await sb.from("stats_joueurs").select("joueur_id,buts,passes_decisives,gardien").eq("match_id", m.dbId);
 if(!m.statsDraft){
  m.statsDraft = {};
  m.playersOk.forEach(j=>{
   const row = (statsRows||[]).find(r=>r.joueur_id===j.id);
   m.statsDraft[j.id] = {buts:row?row.buts:0, pd:row?row.passes_decisives:0, gardien:row?row.gardien:false};
  });
 }
 m.scoreOfficiel = m.home==="PARIS ASF" ? (m.score?m.score[0]:null) : (m.score?m.score[1]:null);

 const rv = await sb.rpc("etat_vote", {p_match:m.dbId});
 m.voteErr = rv.error ? rv.error.message : null;
 const ev = Array.isArray(rv.data) ? rv.data[0] : rv.data;
 m.vote = ev ? {ouvert:!!ev.ouvert, clos:!!ev.clos, fermeLe:ev.ferme_le||null} : {ouvert:false, clos:false, fermeLe:null};
 const {data:votes} = await sb.from("votes_homme_du_match").select("votant_id,candidat_id").eq("match_id", m.dbId);
 m.myVote = (votes||[]).find(v=>v.votant_id===MY_ID)?.candidat_id || null;
 m.voteCounts = {};
 if(m.vote.clos) (votes||[]).forEach(v=>{ m.voteCounts[v.candidat_id]=(m.voteCounts[v.candidat_id]||0)+1; });
 m.voteVisible = m.vote.clos;
}
function totalStat(m, champ, sauf){
 return (m.playersOk||[]).reduce((a,j)=> a + (j.id===sauf ? 0 : (parseInt((m.statsDraft[j.id]||{})[champ])||0)), 0);
}
function majStatsInfo(avert){
 const m = currentMatch; if(!m) return;
 const z = document.getElementById("statsInfo");
 if(z){ z.textContent = avert || ""; z.style.display = avert ? "block" : "none"; }
 const N = m.scoreOfficiel; if(N===null) return;
 (m.playersOk||[]).forEach(j=>{
  const bt = document.querySelector(`[data-stat-buts="${j.id}"]`), pd = document.querySelector(`[data-stat-pd="${j.id}"]`);
  if(bt) bt.max = Math.max(0, N - totalStat(m,"buts",j.id));
  if(pd) pd.max = Math.max(0, N - totalStat(m,"pd",j.id));
 });
}
function onStatInput(el, champ, id){
 const m = currentMatch; if(!m || !m.statsDraft[id]) return;
 let v = el.value==="" ? 0 : Math.max(0, parseInt(el.value,10)||0), avert = "";
 if(m.scoreOfficiel!==null){
  const max = Math.max(0, m.scoreOfficiel - totalStat(m, champ, id));
  if(v>max){
   v = max; el.value = String(max);
   avert = `Maximum ${max} : le total des ${champ==="buts"?"buts":"passes décisives"} ne peut pas dépasser le score de l'équipe (${m.scoreOfficiel}).`;
  }
 }
 if(el.value!=="" && String(v)!==el.value) el.value = String(v);
 m.statsDraft[id][champ] = el.value==="" ? "" : v;
 majStatsInfo(avert);
}
async function enregistrerStats(m){
 const N = m.scoreOfficiel, tb = totalStat(m,"buts"), tp = totalStat(m,"pd");
 if(N!==null && tb>N){ alert(`Le total des buts saisis (${tb}) dépasse le score de l'équipe (${N}).`); return; }
 if(N!==null && tp>N){ alert(`Le total des passes décisives saisies (${tp}) dépasse le score de l'équipe (${N}).`); return; }
 const writes = m.playersOk.map(j=>{ const s = m.statsDraft[j.id]||{}; return {match_id:m.dbId, joueur_id:j.id, buts:parseInt(s.buts)||0, passes_decisives:parseInt(s.pd)||0, gardien:!!s.gardien}; });
 const {error} = await sb.from("stats_joueurs").upsert(writes, {onConflict:"match_id,joueur_id"});
 if(error){ alert("Enregistrement impossible : "+error.message); return; }
 const r2 = await sb.from("matchs").update({stats_remplies:true}).eq("id", m.dbId).select("id");
 if(r2.error || !r2.data || !r2.data.length){ alert("Enregistrement impossible : "+(r2.error?r2.error.message:"droits insuffisants (SQL add_stats_manager.sql exécuté ?)")); return; }
 m.statsRemplies = true;
 await loadPastMatchData(m); render();
}
async function validerFeuille(m){
 const writes = Object.entries(m.validationDraft).map(([joueur_id, a_reellement_joue])=>({match_id:m.dbId, joueur_id, a_reellement_joue}));
 const r1 = await sb.from("presences").upsert(writes, {onConflict:"match_id,joueur_id"});
 if(r1.error){ alert("Validation impossible : "+r1.error.message); return; }
 const r2 = await sb.from("matchs").update({feuille_validee:true}).eq("id", m.dbId).select("id");
 if(r2.error || !r2.data || !r2.data.length){ alert("Validation impossible : "+(r2.error?r2.error.message:"droits insuffisants (SQL add_feuille_validee.sql exécuté ?)")); return; }
 m.feuilleValidee = true;
 await loadPastMatchData(m); render();
}
async function voter(m, candidatId){
 const {error} = await sb.from("votes_homme_du_match").upsert({match_id:m.dbId, votant_id:MY_ID, candidat_id:candidatId}, {onConflict:"match_id,votant_id"});
 if(error){ alert("Vote impossible : "+error.message); return; }
 await loadPastMatchData(m); render();
}

// Fonction de génération d'une ligne du calendrier (Inchangée par rapport à l'originale pour éviter les conflits)
function matchRow(m, isNext){
 const st = m.status==="past"?"past":(m.presence && ME && m.presence[ME]==="oui"?"yes":m.presence && ME && m.presence[ME]==="non"?"no":"wait");
 const homeWin = !!m.score && m.score[0]>m.score[1], awayWin = !!m.score && m.score[1]>m.score[0];
 return `<div class="mrow" data-open="\${m.id}"\${isNext?' id="nextMatch"':''}>
  <div class="dblock d-\${st}" data-color-match="\${m.dbId || ''}"><b>\${fmtDay(m.dt)}</b><span>\${fmtMonAbbr(m.dt)}</span></div>
  <div class="minfo">
   ${m.comp==="Coupe"?`<div class="comp">🏆 Coupe</div>`:''}
   <div class="trow \${homeWin?'win':''}"><span>\${m.domicile || m.home}</span><span>${m.score?m.score[0]:'-'}</span></div>
   <div class="trow \${awayWin?'win':''}"><span>\${m.exterieur || m.away}</span><span>${m.score?m.score[1]:'-'}</span></div>
   <div class="venue">\${fmtTime(m.dt)} · \${m.venue}</div>
  </div></div>`;
}
